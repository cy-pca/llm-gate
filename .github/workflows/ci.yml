name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck llm-gate.sh ci.sh tests/run.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS covers the system bash 3.2; Windows covers Git Bash.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: bash tests/run.sh
        shell: bash

  llm-gate:
    # This checkout, run as the action against this repository's own commits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
